# Babel extraction config for the web UI translations, used by "make translations"
# See lazylibrarian/locale/README.md
[python: lazylibrarian/**.py]

[mako: data/interfaces/**.html]
input_encoding = utf-8

# config_functions.js is a Mako template too, included by config.html
[mako: data/interfaces/**.js]
input_encoding = utf-8
