<%inherit file="base.html"/>
<%!
    import lazylibrarian
%>
<%def name="headerIncludes()">
    <div id="subhead_container">
        <div id="subhead_menu">
        </div>
    </div>
</%def>
<%def name="body()">
<form accept-charset="UTF-8" action="comic_update" method="post">
    <div class="configtable">
        <input name="utf8" type="hidden" value="&#x2713;" />
        <fieldset>
            <legend>${title | h}</legend>
            <div class="form-group">
                <input type="text" id="comicid" name="comicid" value="${config['ComicID']}" class="hidden">
            </div>
            <div class="form-group">
                <label for="new_name" class="control-label">${_('Comic Title:')}</label>
                <input type="text" id="new_name" name="new_name" value="${config['Title']}" class="form-control" placeholder="${_('Comic Title') | h}">
            </div>
            <div class="form-group">
                <label for="new_id" class="control-label">${_('Comic ID:')}</label>
                <input type="text" id="new_id" name="new_id" value="${config['ComicID']}" class="form-control" placeholder="${_('Comic ID') | h}">
            </div>

            <div class="form-group">
                <label for="aka" class="control-label">${_('Aka:')}</label>
                <input type="text" id="aka" name="aka" value="${config['aka']}" class="form-control" placeholder="${_('Alternate IDs') | h}">
            </div>
        <div class="form-group">
          <label for="summernote" class="control-label">${_('Comic Description')}</label>
          <textarea id="summernote" name="editordata" class="form-control" rows="10" placeholder="${_('Nothing to see here...') | h}">${config['Description']}</textarea>
        </div>

</fieldset>
<div class="table_wrapper_button">
  <input type="submit" value="${_('Save changes') | h}" id="add" class="btn btn-primary">
%if perm & lazylibrarian.perm_status:
<button class="pull-right button btn btn-primary" type="button" value="removeme" id="removeme"><i class="fa fa-times"></i> ${_('Delete Comic')}</button>
%endif
</div>
<p>&nbsp;</p>
</div>
</form>
</%def>
<%def name="javascriptIncludes()">
  <script type="text/javascript">
    function initThisPage()

    {
        "use strict";
    }
    $(document).ready(function() {
        initThisPage();
        $('#removeme').click(function () {
            bootbox.confirm({
                message: ${_js('Are you sure you want to permanently delete the comic?')},
                buttons: {
                    confirm: {
                        label: ${_js('Yes')},
                        className: 'btn-success'
                    },
                    cancel: {
                        label: ${_js('No')},
                        className: 'btn-danger'
                    }
                },
                callback: function (result) {
                  if (result) {
                      // mark_comics takes the comic IDs as field names, Delete also removes the issue files
                      var data = {'action': 'Delete'};
                      data[${js(str(config['ComicID']))}] = 'on';
                      $.get("mark_comics", data).always(function () { window.location = "comics"; });
                  }
                }
            });
        });    });
  </script>
</%def>
<html><head></head><body></body></html>
