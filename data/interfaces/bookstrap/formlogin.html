<!DOCTYPE html>
<html lang="en" >

<head>
  <meta charset="UTF-8">
  <title>LazyLibrarian</title>
  <style>
  img {
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
  p {
   text-align:center
  }
  h1 {
   text-align:center
  }
  </style>
</head>

<body>
  <form action="login" method="post">
    <input type="hidden" name="from_page" value="${from_page}" />
    <img src="${img}" alt="LazyLibrarian" style="width:10%;">
    <p>
      <input type="text" placeholder="${_('username') | h}" name="current_username" id="current_username" required autofocus autocomplete/>
    </p>
    <p>
		  <input type="password" placeholder="${_('password') | h}" name="current_password" id="current_password" required autocomplete/>
    </p>
    <p>
      <button name="login" id="login">${_('Sign in')}</button>
    </p>
  </form>
</body>

</html>

  <script type="text/javascript">
    $(document).ready(function()
    {
        $('#current_password').keypress(function(e){
            if(e.keyCode==13)
                $('#login').click();
        });
    });
  </script>
