<%inherit file="base.html"/>
<%!
    import lazylibrarian
%>
<%def name="headIncludes()">
</%def>
<%def name="body()">
<h1>${_('LazyLibrarian User Profile')}</h1>
<div class="container">
  <div class="row">
    <div class="col-sm-6 col-sm-offset-3 ptop21">
      <div class="login-container">
        <div class="row">
          <div class="col-xs-12">
              <div class="form-group">
                <label for="fullname">${_('Full Name')}</label>
                <input id="fullname" name="fullname" class="form-control" value="${user['Name']}">
              </div>
              <div class="form-group">
                <label for="email">${_('Email')}</label>
                <input id="email" name="email" class="form-control" value="${user['Email']}">
              </div>
              <div class="form-group">
                <label for="sendto">${_('Send To (eg kindle)')}</label>
                <input id="sendto" name="sendto" class="form-control" value="${user['SendTo']}">
              </div>
              <div class="form-group">
                <label for="lltheme">${_('Theme')}</label>
                <select name="lltheme" id="lltheme" class="form-control">
                  %for btype in themelist:
                      <%
                        if btype == user['Theme']:
                          selected = 'selected="selected"'
                        else:
                          selected = ''
                      %>
                      <option value="${btype}" ${selected}>${btype}</option>
                    %endfor
                </select>
              </div>
              <div class="form-group">
                <label for="username">${_('Username (UserID=%(userid)s)') % {'userid': user['UserID']}}</label>
                <input id="username" class="form-control" name="username" value="${user['UserName']}">
              </div>
              <div class="form-group">
                <label for="booktype">${_('Preferred BookType to open/email')}</label>
                        <select name="booktype" id="booktype" class="form-control">
                          %for btype in typelist:
                          <%
                            if btype == user['BookType']:
                                selected = 'selected="selected"'
                            else:
                                selected = ''
                          %>
                          <option value="${btype}" ${selected}>${btype}</option>
                          %endfor
                        </select>
              </div>
              <div class="form-group">
                <label for="hc_token">${_('HardCover Token')}</label>
                <div class="input-group">
                  <input type="text" id="hc_token" name="hc_token" value="${user['hc_token'] if 'hc_token' in user else ''}" class="form-control" placeholder="${_('Bearer token') | h}">
                  <span class="input-group-btn">
                    <button class="btn btn-default" type="button" id="test_hc_token">${_('Test')}</button>
                  </span>
                </div>
              </div>
              <div class="form-group">
                <label class="ptop15" for="password">${_('Password')}</label>
                <div class="">
                  <input id="password" type="password" class="form-control" name="password" placeholder="${_('Leave empty to keep existing password') | h}">
                </div>
              <div class="form-group">
                <label class="ptop15" for="password">${_('Confirm Password')}</label>
                <div class="">
                  <input id="password2" type="password" class="form-control" name="password2" placeholder="${_('If changing password, enter new password  again here') | h}">
                </div>
              <div class="form-group col-md-12">
                <label for="subs">${_('Subscriptions (for information only)')}</label>
                <textarea id="summernote" name="summernote" class="form-control" rows="10" placeholder="${_('Nothing to see here...') | h}" readonly>${subs}</textarea>
              </div>
              </div>
              <div class="ptop21">
                <button value="save" name="save" id="save" class="btn btn-primary btn-block btn-lg btn-inverse">${_('Update')}</button>
              </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</%def>

<%def name="headIncludes()">
</%def>
<%def name="javascriptIncludes()">
  <script type="text/javascript">
    $(document).ready(function()
    {
      $('#save').click(function() {
          var username = $.trim($("#username").val());
          var password = $.trim($("#password").val());
          var password2 = $.trim($("#password2").val());
          var email = $.trim($("#email").val());
          var sendto = $.trim($("#sendto").val());
          var booktype = $.trim($("#booktype").val());
          var lltheme = $.trim($("#lltheme").val());
          var fullname = $.trim($("#fullname").val());
          var hc_token = $.trim($("#hc_token").val());
          $.get("user_update", {'username': username, 'fullname': fullname, 'password': password, 'password2': password2, 'email': email, 'sendto': sendto, 'booktype': booktype, 'theme': lltheme, 'hc_token': hc_token},
                function (data) {
                bootbox.dialog({
                    title: ${_js('Update User')},
                    message: '<pre>'+data+'</pre>',
                    buttons: {
                        primary: {
                            label: ${_js('Close')},
                            className: 'btn-primary',
                            callback: function(result){ window.location.reload(true) }
                        }
                    }
                });
          });
      });
      
      $('#test_hc_token').click(function() {
          var hc_token = $.trim($("#hc_token").val());
          var userid = $.trim($("#userid").val());
          $.get("test_hcauth", {'hc_token': hc_token, 'userid': userid},
                function (data) {
                bootbox.dialog({
                    title: ${_js('Test HardCover Token')},
                    message: '<pre>'+data+'</pre>',
                    buttons: {
                        primary: {
                            label: ${_js('Close')},
                            className: 'btn-primary'
                        }
                    }
                });
          });
      });
    });
  </script>
</%def>
